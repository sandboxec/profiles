abi: 6
ignore-if-missing: true
unsafe-host-runtime: true
fs:
  - rw:$HOME/.codex/
  - rw:$PWD
  - r:/dev/urandom
  - r:/etc/hosts
  - r:/etc/ld.so.cache
  - r:/etc/localtime
  - r:/etc/nsswitch.conf
  - r:/etc/resolv.conf
  - r:/etc/ssl/certs
  - r:/etc/ssl/certs/ca-certificates.crt
  - r:/proc/
  - r:/proc/self/cgroup
  - r:/proc/self/maps
  - r:/proc/stat
  - r:/sys/devices/system/cpu/online
  - r:/sys/fs/cgroup
  - r:/usr/lib/locale/locale-archive
  - r:/usr/lib/ssl/certs/ca-certificates.crt
  - r:/usr/lib/ssl/openssl.cnf
  - r:/usr/share/locale/locale.alias
  - rw:/dev/null
net:
  - c:443
